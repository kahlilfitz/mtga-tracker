<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Arena Tracker</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #22222e;
      --border: #2e2e40;
      --accent: #c8a84b;
      --accent2: #7b5ea7;
      --green: #4caf7d;
      --red: #e05252;
      --text: #e8e8f0;
      --muted: #7a7a9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.05em; }
    header .updated { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
    .refresh-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .refresh-btn:hover { background: var(--border); }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .warning { background: #3a2a10; border: 1px solid #6a4a20; border-radius: 10px; padding: 20px 24px; margin-bottom: 32px; }
    .warning h2 { color: var(--accent); margin-bottom: 8px; }
    .warning p { color: #c8a875; line-height: 1.6; }
    .warning code { background: #2a1a08; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .card .value { font-size: 2rem; font-weight: 700; }
    .card .sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .win-rate-bar { height: 6px; background: var(--surface2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .win-rate-fill { height: 100%; background: linear-gradient(90deg, var(--green), #6dd6a0); border-radius: 3px; transition: width 0.6s ease; }
    .section { margin-bottom: 32px; }
    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .section-header h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-tab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 0.78rem; transition: all 0.15s; }
    .filter-tab:hover { border-color: var(--accent); color: var(--text); }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    th { background: var(--surface2); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px; text-align: left; }
    td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
    tr:hover td { background: var(--surface2); }
    .result-win { color: var(--green); font-weight: 600; }
    .result-loss { color: var(--red); font-weight: 600; }
    .result-draw { color: var(--muted); font-weight: 600; }
    .result-unknown { color: var(--muted); }
    .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .rank-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .rank-card .type { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .rank-card .tier { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .rank-card .step { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .no-data { color: var(--muted); font-style: italic; padding: 32px; text-align: center; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
    .wc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .wc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
    .wc .rarity { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .wc .count { font-size: 1.6rem; font-weight: 700; }
    .wc.common .count { color: #aaa; }
    .wc.uncommon .count { color: #a8d0f0; }
    .wc.rare .count { color: var(--accent); }
    .wc.mythic .count { color: #e8824a; }
    /* Curve tooltip */
    #curve-tip { position:fixed; background:#1e1e2e; border:1px solid var(--border); border-radius:8px;
      padding:10px 14px; font-size:0.8rem; pointer-events:none; z-index:9999; display:none;
      max-width:220px; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
    #curve-tip .ct-cmc { font-weight:700; color:var(--accent); margin-bottom:6px; font-size:0.85rem; }
    #curve-tip .ct-card { display:flex; justify-content:space-between; gap:12px; padding:2px 0;
      border-bottom:1px solid var(--border); }
    #curve-tip .ct-card:last-child { border-bottom:none; }
    #curve-tip .ct-name { color:var(--text); }
    #curve-tip .ct-rarity { font-size:0.7rem; text-transform:capitalize; }
    /* Top nav */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; gap: 0; overflow-x: auto; }
    .nav-tab { background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); padding: 14px 20px; cursor: pointer; font-size: 0.88rem; font-weight: 500; white-space: nowrap; transition: all 0.15s; letter-spacing: 0.03em; }
    .nav-tab:hover { color: var(--text); border-bottom-color: var(--border); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    /* Draft cards */
    .draft-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .draft-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .draft-title { font-size: 1rem; font-weight: 600; margin-bottom: 3px; }
    .draft-deck { font-size: 0.8rem; color: var(--muted); }
    .draft-record { font-size: 1.6rem; font-weight: 700; }
    .draft-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .draft-stat { background: var(--surface2); border-radius: 8px; padding: 10px 14px; }
    .draft-stat .ds-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .draft-stat .ds-val { font-size: 1.1rem; font-weight: 600; }
    .game-trail { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .game-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; }
    .game-dot.win { background: rgba(76,175,125,0.2); border: 1.5px solid var(--green); color: var(--green); }
    .game-dot.loss { background: rgba(224,82,82,0.2); border: 1.5px solid var(--red); color: var(--red); }
  </style>
</head>
<body>
<header>
  <h1>🃏 MTG Arena Tracker</h1>
  <span class="updated" id="updated"></span>
  <button class="refresh-btn" onclick="load()">↻ Refresh</button>
</header>
<nav id="top-nav"></nav>
<main id="main">
  <p style="color:var(--muted);padding:48px;text-align:center;">Loading…</p>
</main>

<div id="curve-tip"></div>

<script>
let _data = null;
let _page = 'profile'; // profile | draft | ladder | alchemy | historic | direct | other

// Custom curve tooltip
const tip = document.getElementById('curve-tip');
document.addEventListener('mousemove', e => {
  if (tip.style.display === 'block') {
    const x = e.clientX + 14, y = e.clientY + 14;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = (x + w > window.innerWidth ? e.clientX - w - 8 : x) + 'px';
    tip.style.top  = (y + h > window.innerHeight ? e.clientY - h - 8 : y) + 'px';
  }
});
let _curveData = {};
let _curveId = 0;

function showCurveTip(cmc, bucket) {
  const label = cmc === '7' ? '7+' : cmc;
  let html = `<div class="ct-cmc">CMC ${label} — ${bucket.total} card${bucket.total !== 1 ? 's' : ''}</div>`;
  for (const c of bucket.cards) {
    const col = RARITY_COLORS[c.rarity] || 'var(--muted)';
    html += `<div class="ct-card">
      <span class="ct-name">${c.qty > 1 ? `${c.qty}× ` : ''}${c.name}</span>
      <span class="ct-rarity" style="color:${col}">${c.rarity}</span>
    </div>`;
  }
  tip.innerHTML = html;
  tip.style.display = 'block';
}
function hideCurveTip() { tip.style.display = 'none'; }

// Delegated hover for curve bars
document.addEventListener('mouseover', e => {
  const bar = e.target.closest('[data-cid]');
  if (bar) {
    const { cmc, bucket } = _curveData[bar.dataset.cid] || {};
    if (bucket) showCurveTip(cmc, bucket);
  } else {
    hideCurveTip();
  }
});
async function load() {
  try {
    _data = await window.api.reparse();
    render(_data);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="warning"><h2>No data found</h2><p>Could not read the MTG Arena log file. Make sure MTG Arena has been run at least once with Detailed Logs enabled.</p></div>`;
  }
}

function buildPages(d) {
  const groups = new Set(d.matches.map(m => groupKey(m.format)));
  const ORDER  = ['ladder', 'alchemy', 'historic', 'direct', 'other'];
  const LABELS = { ladder:'Standard', alchemy:'Alchemy', historic:'Historic', direct:'Direct', other:'Other' };
  const pages  = [{ key: 'profile', label: 'Profile' }];
  if (d.drafts.length > 0) pages.push({ key: 'draft', label: 'Draft' });
  for (const g of ORDER) if (groups.has(g)) pages.push({ key: g, label: LABELS[g] });
  return pages;
}

function renderNav(pages) {
  document.getElementById('top-nav').innerHTML = pages.map(p =>
    `<button class="nav-tab${_page === p.key ? ' active' : ''}" onclick="setPage('${p.key}')">${p.label}</button>`
  ).join('');
}

function setPage(p) {
  _page = p;
  renderNav(buildPages(_data));
  renderMain(_data);
}

function formatLabel(fmt) {
  if (!fmt) return 'Unknown';
  const map = {
    'Ladder': 'Ladder', 'Alchemy_Ladder': 'Alchemy', 'Traditional_Ladder': 'Trad. Ladder',
    'Historic_Ladder': 'Historic', 'Alchemy_Play': 'Alchemy Play', 'Play': 'Play',
    'DirectGame': 'Direct', 'Traditional_Alchemy_Ladder': 'Trad. Alchemy',
  };
  if (map[fmt]) return map[fmt];
  if (fmt.startsWith('PremierDraft')) return 'Premier Draft';
  if (fmt.startsWith('QuickDraft')) return 'Quick Draft';
  if (fmt.startsWith('ArenaLimited')) return 'Limited Event';
  if (fmt.startsWith('TradDraft')) return 'Trad. Draft';
  if (fmt.startsWith('PickTwoDraft')) return 'Pick Two Draft';
  const parts = fmt.split('_');
  return parts[0].replace(/([a-z])([A-Z])/g, '$1 $2');
}

function groupKey(fmt) {
  if (!fmt) return 'other';
  if (fmt.includes('Draft') || fmt.includes('Sealed') || fmt.startsWith('ArenaLimited')) return 'draft';
  if (fmt === 'DirectGame') return 'direct';
  if (fmt.includes('Alchemy')) return 'alchemy';
  if (fmt.includes('Historic')) return 'historic';
  return 'ladder';
}

function matchStatsHtml(matches) {
  const wins = matches.filter(m => m.result === 'win').length;
  const losses = matches.filter(m => m.result === 'loss').length;
  const total = matches.length;
  const wr = total ? Math.round(wins / total * 100) : 0;
  return `<div class="grid">
    <div class="card">
      <div class="label">Win Rate</div>
      <div class="value" style="color:${wr >= 50 ? 'var(--green)' : 'var(--red)'}">${total ? wr + '%' : '—'}</div>
      <div class="win-rate-bar"><div class="win-rate-fill" style="width:${wr}%"></div></div>
      <div class="sub">${wins}W – ${losses}L of ${total} matches</div>
    </div>
    <div class="card"><div class="label">Matches</div><div class="value">${total}</div></div>
  </div>`;
}

function matchTableHtml(matches) {
  if (matches.length === 0) return `<div class="no-data">No matches recorded.</div>`;
  let html = `<table><thead><tr><th>#</th><th>Result</th><th>Type</th><th>Opponent</th><th>Deck</th></tr></thead><tbody>`;
  matches.slice(0, 50).forEach((m, i) => {
    html += `<tr>
      <td style="color:var(--muted)">${matches.length - i}</td>
      <td class="result-${m.result}">${m.result.toUpperCase()}</td>
      <td style="color:var(--muted);font-size:0.8rem">${formatLabel(m.format)}</td>
      <td>${m.opponentName || '—'}</td>
      <td style="color:var(--muted)">${m.deckName || '—'}</td>
    </tr>`;
  });
  return html + `</tbody></table>`;
}

function renderProfilePage(d) {
  let html = matchStatsHtml(d.matches);
  html += `<div class="card" style="margin-top:16px"><div class="label">Draft Events</div><div class="value">${d.drafts.length}</div></div>`;

  if (d.rank) {
    const r = d.rank;
    const cWR = r.constructed.wins + r.constructed.losses > 0 ? Math.round(r.constructed.wins / (r.constructed.wins + r.constructed.losses) * 100) : 0;
    const lWR = r.limited.wins + r.limited.losses > 0 ? Math.round(r.limited.wins / (r.limited.wins + r.limited.losses) * 100) : 0;
    html += `<div class="section" style="margin-top:24px"><div class="section-header"><h2>Rank</h2></div>
    <div class="rank-grid">
      <div class="rank-card">
        <div class="type">Constructed</div>
        <div class="tier">${r.constructed.class} ${r.constructed.level}</div>
        <div class="step">Step ${r.constructed.step} · ${r.constructed.wins}W ${r.constructed.losses}L this season · ${cWR}% WR</div>
      </div>
      <div class="rank-card">
        <div class="type">Limited</div>
        <div class="tier">${r.limited.class} ${r.limited.level}</div>
        <div class="step">Step ${r.limited.step} · ${r.limited.wins}W ${r.limited.losses}L this season · ${lWR}% WR</div>
      </div>
    </div></div>`;
  }

  if (d.inventory) {
    const inv = d.inventory;
    html += `<div class="section"><div class="section-header"><h2>Inventory</h2></div>
    <div class="grid" style="margin-bottom:16px">
      <div class="card"><div class="label">Gold</div><div class="value" style="color:var(--accent)">${inv.gold.toLocaleString()}</div></div>
      <div class="card"><div class="label">Gems</div><div class="value" style="color:var(--accent2)">${inv.gems.toLocaleString()}</div></div>
    </div>
    <div class="wc-grid">
      <div class="wc common"><div class="rarity">Common</div><div class="count">${inv.wcCommon}</div></div>
      <div class="wc uncommon"><div class="rarity">Uncommon</div><div class="count">${inv.wcUncommon}</div></div>
      <div class="wc rare"><div class="rarity">Rare</div><div class="count">${inv.wcRare}</div></div>
      <div class="wc mythic"><div class="rarity">Mythic</div><div class="count">${inv.wcMythic}</div></div>
    </div></div>`;
  }

  return html;
}

function renderDraftPage(d) {
  if (d.drafts.length === 0) return `<div class="no-data">No draft events recorded.</div>`;
  return d.drafts.map(renderDraftCard).join('');
}

function renderFormatPage(d, key) {
  const matches = [...d.matches].reverse().filter(m => groupKey(m.format) === key);
  return matchStatsHtml(matches) + `<div class="section" style="margin-top:24px"><div class="section-header"><h2>Recent Matches</h2></div>${matchTableHtml(matches)}</div>`;
}

function renderMain(d) {
  // Drop tooltip data from the previous render so it doesn't accumulate
  // (and pin old _data snapshots) across refreshes and page switches.
  _curveData = {};
  _curveId = 0;
  hideCurveTip();
  let html = '';
  if (_page === 'profile')     html = renderProfilePage(d);
  else if (_page === 'draft')  html = renderDraftPage(d);
  else                         html = renderFormatPage(d, _page);
  document.getElementById('main').innerHTML = html;
}

function longestStreak(matches) {
  let best = { win: 0, loss: 0 }, cur = { win: 0, loss: 0 };
  for (const m of matches) {
    if (m.result === 'win') { cur.win++; cur.loss = 0; }
    else { cur.loss++; cur.win = 0; }
    best.win = Math.max(best.win, cur.win);
    best.loss = Math.max(best.loss, cur.loss);
  }
  return best;
}

const COLOR_META = {
  W: { label: 'White', bg: '#f5f0d0', text: '#5a4a00', symbol: '☀' },
  U: { label: 'Blue',  bg: '#b0d4f0', text: '#0a2a50', symbol: '💧' },
  B: { label: 'Black', bg: '#4a4060', text: '#d0c0f0', symbol: '💀' },
  R: { label: 'Red',   bg: '#f0845a', text: '#3a0a00', symbol: '🔥' },
  G: { label: 'Green', bg: '#6ab870', text: '#0a2a0a', symbol: '🌲' },
};

function renderColorBar(colors) {
  if (!colors || Object.keys(colors).length === 0) return '';
  const total = Object.values(colors).reduce((a, b) => a + b, 0);
  const order = ['W', 'U', 'B', 'R', 'G'];
  const segments = order.filter(c => colors[c]).map(c => {
    const pct = Math.round(colors[c] / total * 100);
    const m = COLOR_META[c];
    return `<div style="flex:${colors[c]};background:${m.bg};display:flex;align-items:center;justify-content:center;
      font-size:0.7rem;font-weight:700;color:${m.text};gap:3px;min-width:28px" title="${m.label}: ${colors[c]} cards">
      ${m.symbol} ${colors[c]}
    </div>`;
  });
  return `<div style="display:flex;border-radius:6px;overflow:hidden;height:28px;margin-bottom:12px">${segments.join('')}</div>`;
}

const RARITY_COLORS = {
  mythic:   '#e8824a',
  rare:     '#c8a84b',
  uncommon: '#a8d0f0',
  common:   '#8888aa',
  land:     '#667755',
};
const RARITY_ORDER = ['mythic', 'rare', 'uncommon', 'common', 'land'];

function renderCurve(curve) {
  if (!curve || Object.keys(curve).length === 0) return '';
  const labels = ['0','1','2','3','4','5','6','7+'];
  const maxVal = Math.max(...labels.map((_,i) => (curve[String(i)] || {total:0}).total));
  if (maxVal === 0) return '';

  const bars = labels.map((lbl, idx) => {
    const key = String(idx);
    const bucket = curve[key] || {total: 0, rarities: {}, cards: []};
    const total = bucket.total;
    const pct = maxVal ? total / maxVal * 100 : 0;

    // Build stacked segments (bottom = common, top = mythic)
    const stackH = 64;
    const segments = RARITY_ORDER.slice().reverse().map(r => {
      const cnt = (bucket.rarities || {})[r] || 0;
      if (!cnt) return '';
      const h = Math.max(2, Math.round(cnt / maxVal * stackH));
      return `<div style="width:100%;height:${h}px;background:${RARITY_COLORS[r]};flex-shrink:0"></div>`;
    }).join('');

    let tipAttrs = '';
    if (total) {
      const cid = `cb${_curveId++}`;
      _curveData[cid] = { cmc: key, bucket };
      tipAttrs = `data-cid="${cid}"`;
    }

    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:${total?'pointer':'default'}" ${tipAttrs}>
      <div style="font-size:0.7rem;color:var(--muted)">${total || ''}</div>
      <div style="width:100%;background:var(--surface2);border-radius:3px 3px 0 0;height:${stackH}px;
          display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
        ${segments}
      </div>
      <div style="font-size:0.7rem;color:var(--muted)">${lbl}</div>
    </div>`;
  });

  // Legend
  const legendItems = RARITY_ORDER.map(r =>
    `<span style="display:flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--muted)">
      <span style="width:8px;height:8px;border-radius:2px;background:${RARITY_COLORS[r]};display:inline-block"></span>${r}
    </span>`
  ).join('');

  return `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em">Mana Curve</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${legendItems}</div>
    </div>
    <div style="display:flex;gap:4px;align-items:flex-end">${bars.join('')}</div>
  </div>`;
}

function renderDraftCard(dr) {
  const total = dr.wins + dr.losses;
  const wr = total ? Math.round(dr.wins / total * 100) : 0;
  const recordColor = dr.wins > dr.losses ? 'var(--green)' : dr.losses > dr.wins ? 'var(--red)' : 'var(--text)';

  const trail = dr.matches.map(m =>
    `<div class="game-dot ${m.result}" title="${m.result === 'win' ? 'W' : 'L'} vs ${m.opponentName}">${m.result === 'win' ? 'W' : 'L'}</div>`
  ).join('');

  const cs = dr.cardStats;

  return `<div class="draft-card">
    <div class="draft-card-header">
      <div>
        <div class="draft-title">${dr.displayName}</div>
        <div class="draft-deck">${dr.deckName || '<em>no deck name</em>'}</div>
      </div>
      <div style="text-align:right">
        <div class="draft-record" style="color:${recordColor}">${dr.wins}–${dr.losses}</div>
        <div style="font-size:0.75rem;color:var(--muted)">${wr}% win rate</div>
      </div>
    </div>
    <div class="draft-stats-grid">
      <div class="draft-stat"><div class="ds-label">Games</div><div class="ds-val">${total}</div></div>
      <div class="draft-stat"><div class="ds-label">Win Rate</div><div class="ds-val" style="color:${wr >= 50 ? 'var(--green)' : 'var(--red)'}">${wr}%</div></div>
      <div class="draft-stat"><div class="ds-label">Best Win Streak</div><div class="ds-val" style="color:var(--green)">${dr.bestWinStreak}</div></div>
      <div class="draft-stat"><div class="ds-label">Worst Loss Streak</div><div class="ds-val" style="color:var(--red)">${dr.worstLossStreak}</div></div>
    </div>
    ${cs ? renderColorBar(cs.colors) : ''}
    ${cs ? `<div style="margin-bottom:16px">${renderCurve(cs.curve)}</div>` : ''}
    <div style="font-size:0.7rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em">Game Trail</div>
    <div class="game-trail">${trail}</div>
  </div>`;
}

function render(d) {
  document.getElementById('updated').textContent = 'Updated: ' + new Date(d.generated).toLocaleString();

  if (!d.detailedLogsEnabled) {
    document.getElementById('main').innerHTML = `<div class="warning">
      <h2>⚠ Detailed Logs Not Enabled</h2>
      <p>No match data was found in your log file. To enable tracking:<br><br>
      1. Open MTG Arena<br>
      2. Go to <strong>Settings → Account</strong><br>
      3. Enable <strong>Detailed Logs (Verbose)</strong><br>
      4. Restart the game and play a match<br>
      5. Run <code>python3 parse.py</code> and refresh this page</p>
    </div>`;
    return;
  }

  const pages = buildPages(d);
  if (!pages.find(p => p.key === _page)) _page = 'profile';
  renderNav(pages);
  renderMain(d);
}

load();
</script>
</body>
</html>
